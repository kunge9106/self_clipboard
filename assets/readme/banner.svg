<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="轻贴：Windows 剪贴板历史管理器">
  <defs>
    <linearGradient id="bg" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#141a26"/>
      <stop offset="0.5" stop-color="#0d121b"/>
      <stop offset="1" stop-color="#080b11"/>
    </linearGradient>

    <!-- 两处极淡的光：左上偏蓝、右下偏紫，只用来把深色底「托」出层次 -->
    <radialGradient id="glowA" cx="0.1" cy="0.05" r="0.7">
      <stop offset="0" stop-color="#5b8def" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#5b8def" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#5b8def" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.88" cy="1" r="0.62">
      <stop offset="0" stop-color="#7d6bff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7d6bff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fb0ff"/>
      <stop offset="1" stop-color="#3f61d8"/>
    </linearGradient>

    <!-- 卡片：自上而下极缓的白色叠加，给的是「一片玻璃」而不是一块灰 -->
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.045"/>
    </linearGradient>

    <filter id="cardGlow" x="-20%" y="-25%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#glowA)"/>
  <rect width="1280" height="320" rx="24" fill="url(#glowB)"/>
  <rect x="1" y="1" width="1278" height="318" rx="23" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>

  <!-- 左侧：标识 + 名称 + 一行说明 -->
  <g transform="translate(96 112)">
    <rect width="96" height="96" rx="24" fill="url(#mark)"/>
    <rect x="27" y="16" width="42" height="13" rx="6.5" fill="#ffffff" fill-opacity="0.94"/>
    <rect x="21" y="27" width="54" height="54" rx="11" fill="none" stroke="#ffffff" stroke-opacity="0.92" stroke-width="4.5"/>
    <path d="M34 50h28M34 63h18" stroke="#ffffff" stroke-opacity="0.92" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
    <text x="232" y="168" font-size="80" font-weight="600" letter-spacing="6" fill="#ffffff" fill-opacity="0.96">轻贴</text>
    <text x="238" y="212" font-size="21" letter-spacing="1.2" fill="#8d9fbe">剪贴板历史管理 · 记录只留在本机</text>
  </g>

  <!-- 右侧：三条件目示意，徽章配色与主界面色板一致 -->
  <g transform="translate(780 64)" filter="url(#cardGlow)">
    <!-- 置顶：描边用品牌蓝，与列表里已置顶的卡片同一处理 -->
    <g>
      <rect x="0" y="0" width="404" height="56" rx="13" fill="url(#card)" stroke="#5b8def" stroke-opacity="0.55"/>
      <path d="M13 0.5H391" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="16" y="12" width="26" height="12" rx="3" fill="#a3e635" fill-opacity="0.26"/>
      <rect x="48" y="12" width="26" height="12" rx="3" fill="#22d3ee" fill-opacity="0.24"/>
      <rect x="16" y="32" width="212" height="8" rx="4" fill="#ffffff" fill-opacity="0.52"/>
      <rect x="16" y="44" width="126" height="6" rx="3" fill="#ffffff" fill-opacity="0.2"/>
    </g>

    <!-- 图片 + 截图 -->
    <g>
      <rect x="0" y="68" width="404" height="56" rx="13" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.10"/>
      <path d="M13 68.5H391" stroke="#ffffff" stroke-opacity="0.07"/>
      <rect x="16" y="80" width="26" height="12" rx="3" fill="#a78bfa" fill-opacity="0.26"/>
      <rect x="48" y="80" width="26" height="12" rx="3" fill="#f472b6" fill-opacity="0.26"/>
      <rect x="16" y="100" width="176" height="8" rx="4" fill="#ffffff" fill-opacity="0.46"/>
      <rect x="16" y="112" width="96" height="6" rx="3" fill="#ffffff" fill-opacity="0.18"/>
      <rect x="352" y="76" width="38" height="40" rx="8" fill="#a78bfa" fill-opacity="0.20"/>
      <circle cx="362" cy="87" r="3" fill="#ffffff" fill-opacity="0.5"/>
    </g>

    <!-- 链接 -->
    <g>
      <rect x="0" y="136" width="404" height="56" rx="13" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.08"/>
      <path d="M13 136.5H391" stroke="#ffffff" stroke-opacity="0.06"/>
      <rect x="16" y="148" width="26" height="12" rx="3" fill="#38bdf8" fill-opacity="0.26"/>
      <rect x="16" y="168" width="236" height="8" rx="4" fill="#38bdf8" fill-opacity="0.5"/>
      <rect x="16" y="180" width="148" height="6" rx="3" fill="#ffffff" fill-opacity="0.17"/>
    </g>
  </g>
</svg>
