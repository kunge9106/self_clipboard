<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="轻贴 — 轻量、本地优先的 Windows 剪贴板管理器">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2739"/>
      <stop offset="0.55" stop-color="#141b28"/>
      <stop offset="1" stop-color="#0c1017"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.12" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#5b8def" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#5b8def" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#5b8def" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa5ff"/>
      <stop offset="1" stop-color="#4b6fe0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1280" height="320" rx="26" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="26" fill="url(#glow)"/>
  <rect x="1" y="1" width="1278" height="318" rx="25" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- 左侧剪贴板标识 -->
  <g transform="translate(96,108)">
    <rect width="104" height="104" rx="26" fill="url(#mark)"/>
    <rect x="30" y="18" width="44" height="14" rx="7" fill="#ffffff" fill-opacity="0.92"/>
    <rect x="24" y="30" width="56" height="56" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="5"/>
    <path d="M38 54h28M38 68h18" stroke="#ffffff" stroke-opacity="0.9" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- 右侧历史列表示意：与主界面的徽章色板同色（青柠文本 / 青代码 / 紫图片 / 粉截图 / 天蓝链接） -->
  <g transform="translate(880,60)" opacity="0.96">
    <!-- 卡片 1：文本 + 代码 -->
    <rect x="0" y="2" width="300" height="58" rx="14" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.18"/>
    <rect x="16" y="14" width="24" height="11" rx="3" fill="#a3e635" fill-opacity="0.30"/>
    <rect x="46" y="14" width="24" height="11" rx="3" fill="#22d3ee" fill-opacity="0.28"/>
    <rect x="16" y="32" width="186" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.55"/>
    <rect x="16" y="46" width="112" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.24"/>

    <!-- 卡片 2：图片 + 截图 -->
    <rect x="0" y="70" width="300" height="58" rx="14" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="16" y="82" width="24" height="11" rx="3" fill="#a78bfa" fill-opacity="0.28"/>
    <rect x="46" y="82" width="24" height="11" rx="3" fill="#f472b6" fill-opacity="0.28"/>
    <rect x="16" y="100" width="150" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.48"/>
    <rect x="16" y="114" width="88" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="252" y="80" width="34" height="38" rx="7" fill="#a78bfa" fill-opacity="0.22"/>

    <!-- 卡片 3：链接 -->
    <rect x="0" y="138" width="300" height="58" rx="14" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.11"/>
    <rect x="16" y="150" width="24" height="11" rx="3" fill="#38bdf8" fill-opacity="0.28"/>
    <rect x="16" y="168" width="206" height="9" rx="4.5" fill="#38bdf8" fill-opacity="0.55"/>
    <rect x="16" y="182" width="132" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.2"/>
  </g>

  <!-- 文字 -->
  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC','Hiragino Sans GB',sans-serif" fill="#ffffff">
    <text x="232" y="162" font-size="86" font-weight="700" letter-spacing="4">轻贴</text>
    <text x="236" y="206" font-size="23" fill="#8ea0bd" letter-spacing="1.5">Lightweight · local-first clipboard manager for Windows</text>
  </g>
</svg>
