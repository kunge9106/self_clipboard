<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>轻贴截图</title>
    <link rel="stylesheet" href="/src/shot.css" />
  </head>
  <body>
    <!-- 截图覆盖层：整窗就是一张冻结的屏幕图，上面盖一层可拖拽的选区。
         尺寸由 Rust 端按显示器物理像素设定，webview 缩放已配成 1 CSS px = 1 物理 px，
         所以这里拿到的 clientX/clientY 可以直接当像素坐标交给后端裁剪。 -->
    <img id="shot-img" alt="" draggable="false" decoding="sync" />
    <div id="sel" class="sel" hidden>
      <span class="h nw" data-h="nw"></span>
      <span class="h n" data-h="n"></span>
      <span class="h ne" data-h="ne"></span>
      <span class="h e" data-h="e"></span>
      <span class="h se" data-h="se"></span>
      <span class="h s" data-h="s"></span>
      <span class="h sw" data-h="sw"></span>
      <span class="h w" data-h="w"></span>
      <span id="sel-size" class="sel-size"></span>
    </div>
    <div id="hint" class="hint">
      <b>拖动</b>选择区域 · <b>双击 / 回车</b>复制 · <b>右键 / Esc</b>取消
    </div>
    <!-- 选区工具条：跟着选区走。S1 只放「完成 / 取消」两个按钮 —— 标注工具是 S2 的事，
         但「不知道怎么结束」是基础可用性问题，必须现在解决。 -->
    <div id="sel-bar" class="bar" hidden>
      <button type="button" id="btn-ok" class="bar-btn is-primary">✓ 完成 <kbd>Enter</kbd></button>
      <button type="button" id="btn-cancel" class="bar-btn">✕ 取消 <kbd>Esc</kbd></button>
    </div>
    <script type="module" src="/src/shot.js"></script>
  </body>
</html>
