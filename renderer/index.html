<!--
  self_clipboard — 主界面
  无边框无标题栏，全区域可拖拽，底部有清空按钮
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>self_clipboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="window" id="window">
    <!-- 历史列表 -->
    <div class="list" id="list"></div>

    <!-- 空状态 -->
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">📋</div>
      <div class="empty-text">剪贴板历史为空</div>
      <div class="empty-hint">复制文本或图片后将自动显示在此</div>
    </div>

    <!-- 底部工具栏 -->
    <div class="toolbar">
      <span class="toolbar-count" id="itemCount"></span>
      <button class="btn-clear" id="btnClear" title="清空全部">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
      </button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
