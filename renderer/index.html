<!--
  self_clipboard — 主界面（VisionOS 风格）
  浅色毛玻璃主题，顶部搜索框，卡片式历史记录列表
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>self_clipboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="window" id="window">
    <!-- 顶部搜索框 -->
    <div class="search-area">
      <div class="search-box">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8A8A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input class="search-input" id="searchInput" type="text" placeholder="搜索历史记录..." autocomplete="off" spellcheck="false">
      </div>
    </div>

    <!-- 历史列表 -->
    <div class="list" id="list"></div>

    <!-- 空状态 -->
    <div class="empty-state" id="emptyState">
      <svg class="empty-icon" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
        <polyline points="10 9 9 9 8 9"/>
      </svg>
      <div class="empty-title">暂无相关记录</div>
      <div class="empty-desc">您暂时没有任何剪贴板历史记录</div>
    </div>

    <!-- 底部工具栏 -->
    <div class="toolbar">
      <span class="toolbar-count" id="itemCount"></span>
      <button class="btn-clear" id="btnClear" title="清空全部">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        </svg>
      </button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
